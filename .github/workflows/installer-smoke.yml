name: Installer smoke test

# Installs the published installer on a fresh Windows VM, the closest thing to a new
# user's PC, and checks that it installs, starts, and that the tools that used to need
# Python work without it. The job log needs a sign-in to read, so every result is also
# written as an annotation on the run.
#
# It runs after each release is built, on demand from the Actions tab ("Run workflow",
# with an optional tag), and whenever the test itself changes.
on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test, for example v2.1.0. Leave blank for the latest release."
        required: false
        default: ""
  push:
    branches:
      - main
      - "ci/**"
    paths:
      - ".github/workflows/installer-smoke.yml"
      - "build-config/smoke-test-installer.ps1"

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, WebView2 ${{ matrix.webview2 }})
    # After a release run, only test a release that was actually published.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One failing combination must not hide the result of the others.
      fail-fast: false
      matrix:
        include:
          # Windows Server 2022 is the closest hosted image to Windows 10, and the latest
          # image is the closest to Windows 11.
          - os: windows-2022
            webview2: present
          - os: windows-latest
            webview2: present
          # The same image with the WebView2 Runtime removed first, to prove that Setup
          # installs it. Some Windows 10 PCs really do not have it.
          - os: windows-latest
            webview2: missing
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the installer
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASED_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          $tag = if ($env:RELEASED_TAG) { $env:RELEASED_TAG } else { $env:REQUESTED_TAG }
          $releases = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          $url = if ($tag) { "$releases/download/$tag/acies-scheduler-setup.exe" } else { "$releases/latest/download/acies-scheduler-setup.exe" }
          $installer = Join-Path $env:RUNNER_TEMP "acies-scheduler-setup.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "Downloaded $((Get-Item $installer).Length) bytes"

      - name: Smoke test on a clean machine
        shell: pwsh
        env:
          WEBVIEW2_MODE: ${{ matrix.webview2 }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "acies-scheduler-setup.exe"
          if ($env:WEBVIEW2_MODE -eq "missing") {
            ./build-config/smoke-test-installer.ps1 -InstallerPath $installer -SimulateMissingWebView2
          } else {
            ./build-config/smoke-test-installer.ps1 -InstallerPath $installer
          }
