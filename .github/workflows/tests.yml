name: Tests

# Run the suites on every push to main and every pull request, not only when a
# release tag is built.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      # The CAD scripts must never wait for a file picker on a build machine.
      ACIES_NONINTERACTIVE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Match the development venv and the release build.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      # Tests that need the sibling ElectricalCommands checkout or an AutoCAD
      # Core Console skip themselves here.
      - name: Run Python tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      # The editor's tests import its packages.
      - name: Install page editor dependencies
        shell: pwsh
        run: |
          npm ci --prefix project-pages-editor

      - name: Run JavaScript tests
        shell: pwsh
        run: |
          node --test "tests/*.test.cjs" "project-pages-editor/src/*.test.js"
